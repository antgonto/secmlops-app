name: stage-gates
on:
  workflow_call:
    inputs:
      script: { required: true, type: string }
      artifact: { required: false, type: string, default: none }
      needs_artifact: { required: false, type: string, default: "" }
      download_all: { required: false, type: boolean, default: false }
      entra_login: { required: false, type: boolean, default: false }
permissions: { contents: read, id-token: write }
jobs:
  run:
    runs-on: [self-hosted, lab]
    env: { STAGING: https://staging.secmlops.com, ENTRA_APP_ID: "${{ vars.ENTRA_APP_ID }}" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with: { fetch-depth: 0 }
      - if: inputs.needs_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with: { name: "${{ inputs.needs_artifact }}" }
      - if: inputs.download_all
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with: { merge-multiple: true }
      - name: Authenticate to OpenBao (OIDC)
        uses: hashicorp/vault-action@d1720f055e0635fd932a1d2a48f87a666a57906c   # v3.0.0
        with:
          url: http://bao.secmlops.com:8200
          path: jwt-github
          method: jwt
          role: ci-mlops
          exportToken: true
          secrets: |
            secret/data/mlops/s3 access_key | AWS_ACCESS_KEY_ID ;
            secret/data/mlops/s3 secret_key | AWS_SECRET_ACCESS_KEY ;
            secret/data/mlops/secobserve token | SO_TOKEN ;
            secret/data/mlops/secobserve url | SO_URL
      - if: inputs.entra_login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5   # v2.3.0
        with: { client-id: "${{ vars.ENTRA_APP_ID }}", tenant-id: "${{ vars.ENTRA_TENANT }}", allow-no-subscriptions: true }
      - run: pip install -q -r requirements.txt && bash ${{ inputs.script }}
      - if: always() && inputs.artifact != 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with: { name: "${{ inputs.artifact }}", path: "*.json\n*.sarif\n*.xml\n*.txt\n*.html\nrapidast/", if-no-files-found: ignore }
